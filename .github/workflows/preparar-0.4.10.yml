name: Preparar publicación 0.4.10
on:
  push:
    branches: [preparar-0.4.10]
    paths: [transfer-0410/iniciar.json]
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 46
    steps:
      - uses: actions/checkout@v4
      - name: Preparar recepción de los archivos
        run: |
          set -euo pipefail
          mkdir -p transfer-0410
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/ww-recv.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/ww-recv.pem" -pubout -out transfer-0410/clave.pem
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer-0410/clave.pem
          git commit -m 'Preparar recepción de compilaciones 0.4.10'
          git push origin HEAD:refs/heads/preparar-0.4.10
      - name: Recibir y comprobar las compilaciones aprobadas
        timeout-minutes: 29
        run: |
          set -euo pipefail
          for attempt in $(seq 1 140); do
            git fetch --quiet origin preparar-0.4.10
            if git show FETCH_HEAD:transfer-0410/entrega.json > "$RUNNER_TEMP/ww-entrega.json" 2>/dev/null; then break; fi
            sleep 10
          done
          test -s "$RUNNER_TEMP/ww-entrega.json"
          node .github/scripts/recibir-0410.cjs
          python .github/scripts/comprobar-0410.py preparar
          git fetch origin publish
          test "$(git rev-parse FETCH_HEAD)" = 94bcfe3bbb474f445f4479250cc95e3ee6b4ff61
          git switch -c listos-0.4.10 FETCH_HEAD
          cp -R "$RUNNER_TEMP/release-0410/incoming/." incoming/
          git add incoming
          git commit -m 'Publicar WereWolf 0.4.10 para Windows, macOS, Linux y Android'
          git push origin HEAD:refs/heads/listos-0.4.10
      - name: Verificar la web, los instaladores y los manifiestos públicos
        timeout-minutes: 13
        run: |
          set -euo pipefail
          git fetch origin preparar-0.4.10
          git checkout -B preparar-0.4.10 FETCH_HEAD
          cp "$RUNNER_TEMP/release-0410/index.json" transfer-0410/archivos.json
          git add transfer-0410/archivos.json
          git commit -m 'Registrar sumas de los siete binarios de la 0.4.10'
          git push origin HEAD:refs/heads/preparar-0.4.10
          python .github/scripts/comprobar-0410.py verificar
          git add transfer-0410/publicado.json
          git commit -m 'Verificar públicamente WereWolf 0.4.10'
          git push origin HEAD:refs/heads/preparar-0.4.10
