# Publica en las releases de este repo lo que se suba a la rama «publish»:
#   incoming/VERSION                         versión (p. ej. 0.3.1)
#   incoming/<sistema>/client/…              build del cliente (windows, linux, macos)
#   incoming/<sistema>/launcher/<instalador> (opcional) instalador del launcher
#   incoming/android/launcher/WereWolf-Android.apk (opcional) app de Android
name: Publicar versión

on:
  push:
    branches: [publish]

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_RELEASES_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Publicar
        run: |
          set -e
          version=$(tr -d '[:space:]' < incoming/VERSION)
          builds=(); launchers=()
          for platform in windows linux macos; do
            [ -d "incoming/$platform/client" ] && builds+=(--build "$platform=incoming/$platform/client")
            for f in incoming/$platform/launcher/*; do [ -f "$f" ] && launchers+=(--launcher "$platform=$f"); done
          done
          for f in incoming/android/launcher/*; do [ -f "$f" ] && launchers+=(--launcher "android=$f"); done
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version ya estaba publicada: solo se actualizan los launchers"
            builds=()
          fi
          [ ${#builds[@]} -gt 0 ] || [ ${#launchers[@]} -gt 0 ] || { echo "Nada que publicar"; exit 0; }
          options=()
          if [ -f "incoming/notes/$version.md" ]; then options+=(--release-notes "incoming/notes/$version.md"); fi
          if [ -f "incoming/stage/$version" ]; then options+=(--defer-latest); fi
          if [ "${#builds[@]}" -gt 0 ] && [ -f incoming/android/launcher/WereWolf-Android.apk ]; then
            apksigner=$(find "${ANDROID_HOME:?}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
            [ -x "$apksigner" ]
            certificate=$("$apksigner" verify --print-certs incoming/android/launcher/WereWolf-Android.apk | sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p')
            [[ "$certificate" =~ ^[a-f0-9]{64}$ ]]
            options+=(--android-cert-sha256 "$certificate")
          fi
          python publish_build.py --version "$version" "${builds[@]}" "${launchers[@]}" "${options[@]}"
